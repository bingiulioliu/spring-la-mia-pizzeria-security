<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${edit} ? 'Modifica Ingrediente' : 'Inserisci Nuovo Ingrediente'">Gestione Ingrediente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h3 class="card-title mb-0">
                            <span
                                th:text="${edit} ? '✏️ Modifica Ingrediente' : '🏷️ Nuovo Ingrediente'">Ingrediente</span>
                        </h3>
                    </div>
                    <div class="card-body p-4">

                        <!-- Nota i due punti th:action e th:object -->
                        <form
                            th:action="${edit} ? @{/ingredients/edit/{id}(id=${ingredient.id})} : @{/ingredients/create}"
                            th:object="${ingredient}" method="POST">

                            <!-- ID Nascosto (solamente se in modifica) -->
                            <input type="hidden" th:field="*{id}" th:if="${edit}" />

                            <!-- Nome Ingrediente -->
                            <div class="mb-3">
                                <label for="name" class="form-label fw-bold">Nome Ingrediente</label>
                                <input type="text" id="name" class="form-control" th:field="*{name}"
                                    th:errorclass="is-invalid" placeholder="Mozzarella, Pomodoro, Maionese, etc...">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                                    Errore nome
                                </div>
                            </div>

                            <!-- Descrizione -->
                            <div class="mb-3">
                                <label for="description" class="form-label fw-bold">Descrizione Ingrediente</label>
                                <input type="text" id="description" class="form-control" th:field="*{description}"
                                    th:errorclass="is-invalid" placeholder="Gustoso, dolce e fragrante">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}"
                                    th:errors="*{description}">
                                    Errore descrizione
                                </div>
                            </div>

                            <!-- Pulsanti di Azione -->
                            <div class="d-flex justify-content-between mt-4">
                                <a th:href="@{/ingredients}" class="btn btn-secondary">Annulla</a>

                                <button type="submit" class="btn"
                                    th:classappend="${edit} ? 'btn-warning' : 'btn-success'"
                                    th:text="${edit} ? 'Salva Modifiche' : 'Aggiungi Ingrediente'">
                                    Salva
                                </button>
                            </div>

                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
