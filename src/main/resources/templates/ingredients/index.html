<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Le nostre pizze</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div th:replace="~{fragments/fragments :: navbar('ingredients')}"></div>
    <div class="container my-4">
        <h1 class="mb-4">I nostri ingredienti</h1>

        <a th:href="@{/ingredients/create}" class="btn btn-success">Inserisci nuovo ingrediente</a>

        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-0">

                <!-- Tabella Ingredienti -->
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col">Nome</th>
                                <th scope="col">Descrizione</th>
                                <th scope="col" class="text-center" style="width: 200px;">Azioni</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Ciclo degli ingredienti -->
                            <tr th:each="ingredient : ${ingredients}">
                                <td class="fw-semibold" th:text="${ingredient.name}">Mozzarella</td>
                                <td class="text-secondary" th:text="${ingredient.description}">Fresca e filante</td>

                                <!-- Colonna Azioni -->
                                <td class="text-center">
                                    <div class="btn-group" role="group">

                                        <!-- Pulsante SHOW -->
                                        <a th:href="@{/ingredients/{id}(id=${ingredient.id})}"
                                            class="btn btn-sm btn-outline-info" title="Dettaglio">
                                            <i class="bi bi-eye-fill">Dettagli</i>
                                        </a>

                                        <!-- Pulsante EDIT -->
                                        <a th:href="@{/ingredients/edit/{id}(id=${ingredient.id})}"
                                            class="btn btn-sm btn-outline-warning" title="Modifica">
                                            <i class="bi bi-pencil-fill">Modifica</i>
                                        </a>

                                        <!-- Pulsante DELETE (apre il Modal) -->
                                        <form th:action="@{/ingredients/delete/{id}(id=${ingredient.id})}" method="post">
                                            <button type="submit" class="btn btn-sm btn-danger">Elimina</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>

                            <!-- Messaggio se la lista è vuota -->
                            <tr th:if="${#lists.isEmpty(ingredients)}">
                                <td colspan="4" class="text-center py-4 text-muted">
                                    <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                                    Nessun ingrediente trovato.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

    </div>
</body>

</html>
