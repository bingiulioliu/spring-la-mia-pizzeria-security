<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${edit} ? 'Modifica Offerta' : 'Nuova Offerta'">Gestione Offerta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h3 class="card-title mb-0">
                            <span th:text="${edit} ? '✏️ Modifica Offerta per ' : '🏷️ Nuova Offerta per '">Offerta</span>
                            <strong th:text="${nuovaOfferta.pizza?.name}">Nome Pizza</strong>
                        </h3>
                    </div>
                    <div class="card-body p-4">

                        <!-- Form unico per Create e Edit -->
                        <form th:action="${edit} ? @{/offerte/edit/{id}(id=${nuovaOfferta.id})} : @{/offerte/create}" 
                            th:object="${nuovaOfferta}" 
                            method="POST">

                            <!-- Campo Nascosto ID Offerta (necessario solo per Edit) -->
                            <input type="hidden" th:field="*{id}">

                            <!-- Campo Nascosto ID Pizza (mantiene il legame con la pizza) -->
                            <input type="hidden" th:field="*{pizza.id}">

                            <!-- Titolo Offerta -->
                            <div class="mb-3">
                                <label for="title" class="form-label fw-bold">Titolo Offerta</label>
                                <input type="text" 
                                    id="title" 
                                    class="form-control" 
                                    th:field="*{title}" 
                                    th:errorclass="is-invalid" 
                                    placeholder="Es. Sconto Estate, Promo 2x1">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">
                                    Errore titolo
                                </div>
                            </div>

                            <!-- Data Inizio -->
                            <div class="mb-3">
                                <label for="offerStart" class="form-label fw-bold">Data Inizio</label>
                                <input type="date" 
                                    id="offerStart" 
                                    class="form-control" 
                                    th:field="*{offerStart}" 
                                    th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('offerStart')}" th:errors="*{offerStart}">
                                    Errore data inizio
                                </div>
                            </div>

                            <!-- Data Fine -->
                            <div class="mb-4">
                                <label for="offerEnd" class="form-label fw-bold">Data Fine</label>
                                <input type="date" 
                                    id="offerEnd" 
                                    class="form-control" 
                                    th:field="*{offerEnd}" 
                                    th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('offerEnd')}" th:errors="*{offerEnd}">
                                    Errore data fine
                                </div>
                            </div>

                            <!-- Pulsanti di Azione -->
                            <div class="d-flex justify-content-between">
                                <!-- Torna al dettaglio della pizza specifica -->
                                <a th:href="@{/pizzas/{id}(id=*{pizza.id})}" class="btn btn-secondary">Annulla</a>
                                
                                <button type="submit" 
                                        class="btn" 
                                        th:classappend="${edit} ? 'btn-warning' : 'btn-success'"
                                        th:text="${edit} ? 'Salva Modifiche' : 'Crea Offerta'">
                                    Salva
                                </button>
                            </div>

                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
